services:
    redis:
        image: redis
        restart: always
        expose:
            - '6379'
        volumes:
            - redis_data:/data

    mysql:
        image: mysql
        restart: always
        expose:
            - '3306'
        volumes:
            - data:/var/lib/mysql
        environment:
            MYSQL_DATABASE: themerbot
            MYSQL_USER: themerbot
            MYSQL_PASSWORD: themerbot
            MYSQL_RANDOM_ROOT_PASSWORD: true

    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080

    themerbot:
        image: themerbot
        build:
            context: .
            dockerfile: ./Dockerfile
        env_file: ./.env
        depends_on:
            - redis
            - mysql

volumes:
    data:
    redis_data:
