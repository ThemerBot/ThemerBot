services:
    redis:
        image: redis:8
        restart: always
        expose:
            - '6379'
        volumes:
            - redis_data:/data

    mysql:
        image: mysql:26
        restart: always
        expose:
            - '3306'
        volumes:
            - data:/var/lib/mysql
            - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
        environment:
            MYSQL_DATABASE: themerbot
            MYSQL_USER: themerbot
            MYSQL_PASSWORD: themerbot
            MYSQL_RANDOM_ROOT_PASSWORD: 'true'

    adminer:
        image: adminer:6
        restart: always
        ports:
            - '127.0.0.1:8080:8080'

    themerbot:
        image: themerbot
        build:
            context: .
            dockerfile: ./Dockerfile
        env_file: ./.env
        depends_on:
            - redis
            - mysql

volumes:
    data:
    redis_data:
